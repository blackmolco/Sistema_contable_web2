name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # OJO: no se corre "tsc -b" (typecheck real, project references) aca —
  # tiene ~80 errores preexistentes repartidos en paginas viejas/ocultas
  # (ClientesProveedores, CuentasCobrar/Pagar, Dashboard, F22, Documentos,
  # etc.), acumulados antes de esta sesion. Vercel despliega con
  # "npm run build" (vite build, sin tsc -b), asi que esos errores nunca
  # bloquearon nada en produccion -- pero agregarlo aca tal cual dejaria
  # el pipeline en rojo desde el primer push. Queda pendiente una pasada
  # aparte para limpiarlos y recien ahi sumar un paso de typecheck real.
  lint-and-typecheck:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Tests (frontend)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # backend/tests/ (supertest + vitest propio, backend/vitest.config.mjs) NO
  # se corre aca a proposito: algunos de esos tests (health check, login)
  # sí golpean Prisma/Postgres de verdad (probado localmente: sin un
  # DATABASE_URL de prueba fallan o quedan lentos), así que sumarlos aquí
  # bien hecho requiere levantar un Postgres efímero como "services:" del
  # job, con su propia migracion -- no algo para resolver al apuro. Mientras
  # tanto se siguen corriendo a mano con "cd backend && npm test".
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # "build", no "build:prod": build:prod corre "tsc -b" y hoy tiene ~80
      # errores de TypeScript preexistentes en paginas viejas/ocultas
      # (ClientesProveedores, CuentasCobrar/Pagar, Dashboard, F22,
      # Documentos, etc.). Vercel despliega con "npm run build" (vite
      # build, sin typecheck), asi que este paso valida exactamente lo que
      # de verdad se publica -- agregar tsc -b aca dejaria el pipeline en
      # rojo por errores que nunca bloquearon un deploy real. Queda
      # pendiente una limpieza aparte de esos errores para recien ahi sumar
      # un paso de typecheck real.
      - name: Build production
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # docker se saco a proposito: armaba imagenes que nunca se publican a
  # ningun lado (push: false) -- no aporta nada, solo gasta minutos de CI.
  # Vercel y Render ya hacen su propio build/deploy al hacer push a main.
