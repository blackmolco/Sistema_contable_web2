name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # Typecheck estricto (tsc -b) obligatorio: un error de tipos bloquea el merge.
  # Antes se omitia por ~80 errores heredados de paginas viejas; ya se limpiaron.
  lint-and-typecheck:
    name: Lint y typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck (tsc -b)
        run: npx tsc -b --noEmit

  test:
    name: Tests (frontend)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Tests del backend que NO necesitan base de datos: aislamiento entre
  # empresas (usuario de A contra datos de B), checklist de cierre mensual y
  # motor de remuneraciones. Prisma se reemplaza por un doble en los tests.
  # Los de api.test.mjs (health/login) si golpean Postgres y se corren a mano.
  backend-tests:
    name: Tests (backend, sin base de datos)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      DIRECT_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: ci-secret-solo-para-tests-1234567890
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run offline tests
        run: |
          npx vitest run tests/aislamiento.test.mjs tests/cierreMensual.test.mjs tests/remuneraciones.test.mjs > vitest.log 2>&1 || {
            cat vitest.log
            MSG=$(tail -c 3000 vitest.log | tr -d '\033\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=vitest fallo::$MSG"
            exit 1
          }
          cat vitest.log

  # backend/tests/ (supertest + vitest propio, backend/vitest.config.mjs) NO
  # se corre aca a proposito: algunos de esos tests (health check, login)
  # sí golpean Prisma/Postgres de verdad (probado localmente: sin un
  # DATABASE_URL de prueba fallan o quedan lentos), así que sumarlos aquí
  # bien hecho requiere levantar un Postgres efímero como "services:" del
  # job, con su propia migracion -- no algo para resolver al apuro. Mientras
  # tanto se siguen corriendo a mano con "cd backend && npm test".
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, backend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build:prod

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # docker se saco a proposito: armaba imagenes que nunca se publican a
  # ningun lado (push: false) -- no aporta nada, solo gasta minutos de CI.
  # Vercel y Render ya hacen su propio build/deploy al hacer push a main.
